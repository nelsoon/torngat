[package]
name = "torngatd"
description = "Torngat node daemon. M0 dev entry points until init/join land."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
rcgen = "0.14"
tokio = { version = "1.35", features = ["rt-multi-thread", "macros", "net", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
torngat-agent = { path = "../agent" }
torngat-api = { path = "../../api" }
torngat-apiserver = { path = "../apiserver" }
torngat-controller = { path = "../controller" }
torngat-store = { path = "../store" }

[lints]
workspace = true
