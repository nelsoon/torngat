[package]
name = "torngatd"
description = "Torngat node daemon: init, join, run."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = ["tpm"]
# TPM-held node keys (needs the tpm2-tss libraries).
tpm = ["torngat-agent/tpm"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
rmp-serde = "1.3"
serde.workspace = true
serde_json.workspace = true
time.workspace = true
tokio = { version = "1.35", features = ["rt-multi-thread", "macros", "net", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
torngat-agent = { path = "../agent" }
torngat-api = { path = "../../api" }
torngat-apiserver = { path = "../apiserver" }
torngat-attest = { path = "../attest" }
torngat-controller = { path = "../controller" }
torngat-keys = { path = "../keys" }
torngat-pki = { path = "../pki" }
torngat-store = { path = "../store" }
torngat-uploads = { path = "../uploads" }
zeroize = { version = "1.9", features = ["serde"] }

[dev-dependencies]
tempfile = "3.4"

[lints]
workspace = true
