[package]
name = "torngat-agent"
description = "Torngat node agent: inventory, workload runtime, controller connection."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
pem = "4"
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1.35", features = ["sync", "time", "rt", "macros", "fs", "process", "net", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tonic = { version = "0.14", default-features = false, features = ["transport", "tls-ring", "channel"] }
tracing = "0.1"
uuid.workspace = true
torngat-api = { path = "../../api" }
torngat-pki = { path = "../pki" }
torngat-proto = { path = "../proto" }

[dev-dependencies]
tempfile = "3.4"
tokio = { version = "1.35", features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
