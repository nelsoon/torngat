[package]
name = "torngat-agent"
description = "Torngat node agent: inventory, workload runtime, controller connection."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# TPM-held node keys and attestation (needs the tpm2-tss libraries).
tpm = ["dep:tss-esapi", "dep:p256", "dep:torngat-attest"]

[dependencies]
p256 = { version = "0.14", default-features = false, features = ["ecdsa"], optional = true }
pem = "4"
sha2 = "0.11"
tss-esapi = { version = "7.7", optional = true }
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tower = { version = "0.5", features = ["util"] }
rcgen = "0.14"
rustix = { version = "1.1", features = ["fs", "net", "std"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-native-certs = "0.8"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1.35", features = ["sync", "time", "rt", "rt-multi-thread", "macros", "fs", "process", "net", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tonic = { version = "0.14", default-features = false, features = ["transport", "tls-ring", "channel"] }
tracing = "0.1"
uuid.workspace = true
zeroize = "1.9"
torngat-api = { path = "../../api" }
torngat-attest = { path = "../attest", optional = true }
torngat-pki = { path = "../pki" }
torngat-proto = { path = "../proto" }

[dev-dependencies]
tempfile = "3.4"
tokio = { version = "1.35", features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
