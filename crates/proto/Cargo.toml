[package]
name = "torngat-proto"
description = "Internal control protocol between Torngat controllers and node agents."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
prost = "0.14"
tonic = { version = "0.14", default-features = false, features = ["codegen", "transport", "tls-ring"] }
tonic-prost = "0.14"

[build-dependencies]
protoc-bin-vendored = "3.3"
tonic-prost-build = "0.14"
