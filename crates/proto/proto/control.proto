syntax = "proto3";

// Internal protocol between node agents and controllers. Never exposed to tenants.
// Agents connect to a controller over mTLS; the caller's node identity comes from its client
// certificate, never from message fields. Resource payloads are JSON-encoded types of the
// `torngat-api` crate (single schema source), tagged with `api_version`.
package torngat.control.v1;

service Control {
  // Report (or refresh) this node's inventory. Idempotent.
  rpc Register(RegisterRequest) returns (RegisterResponse);
  // Liveness. Soft state on the controller; never written to Raft.
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  // Stream of the full set of instances assigned to the caller, sent on every change.
  rpc Assignments(AssignmentsRequest) returns (stream AssignmentSet);
  // Observed state of one instance assigned to the caller.
  rpc ReportInstance(InstanceReport) returns (ReportResponse);
  // Key of a volume that is on the caller. The node keeps it in memory only, and asks again after a
  // reboot. Made at the first call.
  rpc GetVolumeKey(VolumeKeyRequest) returns (VolumeKeyResponse);
  // What the node found in one of its storage pools.
  rpc ReportPool(PoolReport) returns (ReportResponse);
  // What the node did with a volume on one of its pools.
  rpc ReportVolume(VolumeReport) returns (ReportResponse);
  // How the import of an image assigned to the caller goes.
  rpc ReportImage(ImageReport) returns (ReportResponse);
}

message RegisterRequest {
  string api_version = 1;
  // JSON of torngat_api::node::NodeStatus.
  bytes node_status_json = 2;
}
message RegisterResponse {}

message HeartbeatRequest {}
message HeartbeatResponse {}

message AssignmentsRequest {}
message AssignmentSet {
  string api_version = 1;
  // JSON of torngat_api::compute::Instance, one per assigned instance.
  repeated bytes instances_json = 2;
  // JSON of torngat_api::storage::StoragePool: the caller's pools, deleted ones until released.
  repeated bytes pools_json = 3;
  // JSON of torngat_api::storage::Volume: placed, ready and deleting volumes on those pools.
  repeated bytes volumes_json = 4;
  // The controller could not read storage objects: ignore the storage and image lists, they are
  // empty.
  bool storage_unavailable = 5;
  // JSON of torngat_api::image::Image: the images that the caller imports.
  repeated bytes images_json = 6;
  // JSON of torngat_api::settings::ImageSettings. Empty with storage_unavailable.
  bytes image_settings_json = 7;
}

message InstanceReport {
  string org = 1;
  string project = 2;
  string name = 3;
  // The instance's metadata.uid, so a report never applies to a recreated instance.
  string uid = 4;
  // One of: starting, running, stopping, stopped, failed.
  string phase = 5;
  uint64 observed_generation = 6;
  // One of: qemu, cloud_hypervisor, or empty.
  string runtime = 7;
  string message = 8;
}
message ReportResponse {}

message PoolReport {
  string name = 1;
  // The pool's metadata.uid.
  string uid = 2;
  bool ready = 3;
  uint64 capacity_bytes = 4;
  // A power of two, at most 1 GiB.
  uint64 allocation_unit_bytes = 5;
  bool snapshots = 6;
  bool checksums = 7;
  string message = 8;
  // The mark is removed: only for a pool being deleted.
  bool released = 9;
}

// Empty org and project: the platform's.
message VolumeReport {
  string org = 1;
  string project = 2;
  string name = 3;
  string uid = 4;
  // Exists on the node. It is formatted (encrypted) when an instance first uses it.
  bool created = 5;
  // What the instance can see.
  uint64 size_bytes = 6;
  // Its blocks are gone: only for a volume being deleted.
  bool deleted = 7;
  string message = 8;
  // The node formatted it, or found it formatted: from then on it is never formatted again. Never
  // cleared.
  bool formatted = 9;
  // Open on the node for an instance. Released from its instance only once closed.
  bool open = 10;
  // Filled from its image (status.fill). Never cleared.
  bool filled = 11;
}

// Empty org and project: the platform's.
message VolumeKeyRequest {
  string org = 1;
  string project = 2;
  string name = 3;
  // The volume's metadata.uid.
  string uid = 4;
}
// Empty org and project: the platform's. Each value is written once: a report that changes one is
// refused.
message ImageReport {
  string org = 1;
  string project = 2;
  string name = 3;
  // The image's metadata.uid.
  string uid = 4;
  // Length of the file, from the server. 0: not known yet.
  uint64 download_bytes = 5;
  // Detected from the downloaded file: raw or qcow2; empty if not known yet. With size_bytes.
  string format = 6;
  // Size of the disk that the image holds. 0: not known yet.
  uint64 size_bytes = 7;
  // The image is in its volume.
  bool done = 8;
  // The import cannot succeed; message says why.
  bool failed = 9;
  string message = 10;
}

message VolumeKeyResponse {
  // 32 bytes. Never logged: has no Debug that shows it.
  bytes key = 1;
}

// Enrollment of a new node. Served on its own port with server-only TLS: the caller has no
// certificate yet. It has already checked the controller's CA against the pin in its token.
service Join {
  // Enrollment with a key held in a file (only where the cluster's TPM policy allows it).
  rpc Join(JoinRequest) returns (JoinResponse);
  // A join whose answer was lost: shortly after enrollment, a CSR for exactly the enrolled key
  // gets a fresh certificate without a token. NOT_FOUND otherwise.
  rpc ResumeJoin(ResumeJoinRequest) returns (JoinResponse);
  // Enrollment with a TPM-held key, in two steps: the controller challenges the TPM, the node
  // answers with the activated credential and a certification of its key.
  rpc BeginTpmJoin(TpmJoinRequest) returns (TpmChallenge);
  rpc FinishTpmJoin(TpmJoinAnswer) returns (JoinResponse);
}

message JoinRequest {
  string api_version = 1;
  string token_id = 2;
  bytes token_secret = 3;
  // Name the node asks for. Must be unused, and match the token's node if the token names one.
  string node_name = 4;
  // PKCS#10 CSR (DER) for the node's key. Only its public key is used.
  bytes csr_der = 5;
  reserved 6;
}

message ResumeJoinRequest {
  string api_version = 1;
  string node_name = 2;
  // CSR (DER) signed by the key the node enrolled with.
  bytes csr_der = 3;
}
message TpmJoinRequest {
  string api_version = 1;
  string token_id = 2;
  bytes token_secret = 3;
  string node_name = 4;
  // CSR (DER) signed by the TPM-held node key.
  bytes csr_der = 5;
  // The TPM's RSA 2048 endorsement key certificate (DER).
  bytes ek_cert_der = 6;
  // Marshalled TPMT_PUBLIC of the attestation key and of the node key.
  bytes ak_public = 7;
  bytes node_key_public = 8;
}
message TpmChallenge {
  string challenge_id = 1;
  // Contents of TPM2B_ID_OBJECT and TPM2B_ENCRYPTED_SECRET for TPM2_ActivateCredential.
  bytes id_object = 2;
  bytes encrypted_secret = 3;
  // Qualifying data for TPM2_Certify of the node key by the attestation key.
  bytes nonce = 4;
}
message TpmJoinAnswer {
  string challenge_id = 1;
  bytes activated_secret = 2;
  // Marshalled TPMS_ATTEST and TPMT_SIGNATURE from TPM2_Certify.
  bytes certify_attest = 3;
  bytes certify_signature = 4;
}

message JoinResponse {
  // Node certificate followed by the CA certificate.
  string cert_chain_pem = 1;
}
