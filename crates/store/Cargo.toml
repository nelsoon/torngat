[package]
name = "torngat-store"
description = "Replicated key-value store for the Torngat control plane, built on openraft."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# In-process network and helpers for multi-node tests.
test-util = []

[dependencies]
openraft = { version = "=0.10.1", features = ["serde", "type-alias"] }
openraft-log-wal = { path = "../../third_party/openraft-log-wal" }
fjall = "3.1"
futures = "0.3"
rmp-serde = "1.3"
serde.workspace = true
thiserror.workspace = true
tokio = { version = "1.35", features = ["sync", "rt", "macros", "time"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3.4"
tokio = { version = "1.35", features = ["rt-multi-thread", "macros", "time"] }
torngat-store = { path = ".", features = ["test-util"] }

[lints]
workspace = true
