[package]
name = "torngat-uploads"
description = "Torngat image uploads: parts kept until they are put together and imported."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
sha2 = "0.11"
thiserror.workspace = true
tokio = { version = "1.35", features = ["fs", "io-util", "rt"] }
uuid.workspace = true
torngat-api = { path = "../../api" }
torngat-pki = { path = "../pki" }

[dev-dependencies]
tempfile = "3.4"
tokio = { version = "1.35", features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
