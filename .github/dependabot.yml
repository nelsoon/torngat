# Weekly dependency updates. Third-party actions stay pinned to commit SHAs; Dependabot updates
# the SHA and the version comment together.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Patch and minor bumps in one PR; majors (API changes) come one by one.
      cargo-minor:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
