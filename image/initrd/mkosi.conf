# The initrd inside the UKI: mkosi's own, plus the creation and unlocking of the encrypted root.
# build.sh builds it before the image.
[Include]
Include=mkosi-initrd

[Distribution]
Distribution=debian
Release=trixie
Repositories=main

[Build]
SandboxTrees=../mkosi.sandbox:/
BuildSources=

[Content]
Hostname=torngat
Timezone=UTC
Locale=C.UTF-8
Keymap=us
# As in the image: nothing is activated because a disk with it is attached.
RemoveFiles=
    /usr/lib/udev/rules.d/69-lvm.rules
    /usr/lib/udev/rules.d/64-btrfs.rules
