# Only merge extensions whose dm-verity root hash is signed by a key in /usr/lib/verity.d.
# Unsigned or unprotected images are refused.
[Service]
ExecStart=
ExecStart=systemd-sysext refresh --image-policy=root=signed+absent:usr=signed+absent
# At boot the start-up transaction was computed before the extension's units existed, so the
# daemon-reload after the merge does not start units it wants (torngatd). Queue multi-user.target
# again so they are picked up. Only while booting: a later refresh (an update) must not start a
# torngatd that an operator stopped.
ExecStartPost=-/bin/sh -c 'case "$(systemctl is-system-running)" in initializing|starting) systemctl --no-block start multi-user.target;; esac'
