# Only merge extensions whose dm-verity root hash is signed by a key in /usr/lib/verity.d.
# Unsigned or unprotected images are refused. (Root can still run systemd-sysext by hand with
# another policy: this guards the boot and update paths, not against root.)
[Service]
ExecStart=
ExecStart=systemd-sysext refresh --image-policy=root=signed+absent:usr=signed+absent
ExecReload=
ExecReload=systemd-sysext refresh --image-policy=root=signed+absent:usr=signed+absent
ExecStartPost=-/usr/lib/torngat/start-extension-units
