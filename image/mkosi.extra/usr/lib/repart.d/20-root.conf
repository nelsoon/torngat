# Writable state (/etc, /var), on the rest of the disk. Created by the initrd, encrypted
# (initrd/mkosi.extra/usr/lib/torngat/make-root).
[Partition]
Type=root
Format=ext4
Encrypt=key-file+tpm2
FactoryReset=yes
CopyFiles=/
MakeDirectories=/usr /proc /sys /dev /run /tmp /boot /efi /home /mnt /opt /srv
