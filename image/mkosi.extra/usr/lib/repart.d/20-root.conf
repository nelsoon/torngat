# Writable state (/etc, /var), on the rest of the disk. Created at first boot by the initrd
# (initrd/mkosi.extra/usr/lib/torngat/make-root), encrypted.
[Partition]
Type=root
Format=ext4
Encrypt=key-file+tpm2
CopyFiles=/
MakeDirectories=/usr /proc /sys /dev /run /boot /efi /home /mnt /opt /srv
MakeDirectories=/tmp
GrowFileSystem=yes
