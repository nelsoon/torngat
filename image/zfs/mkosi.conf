# Compiles the ZFS kernel modules for the host image's kernel (build.sh --zfs). build.sh takes the
# modules out of this tree and signs them. It runs mkosi as a normal user, in a user namespace, so that
# what runs here cannot read the keys.
[Distribution]
Distribution=debian
Release=trixie
Repositories=main

[Output]
Format=directory

[Build]
SandboxTrees=../mkosi.sandbox:/
BuildSources=

[Content]
Bootable=no
WithRecommends=no
# The same kernel package as the host image.
Packages=
    linux-image-amd64
    linux-headers-amd64
    zfs-dkms
PostInstallationScripts=build.chroot
