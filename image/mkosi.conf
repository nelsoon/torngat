# Torngat host image: Debian 13, read-only /usr (erofs + dm-verity, signed root hash), writable
# ext4 root for /etc and /var. The platform itself is not in this image: it ships as the signed
# `torngat-platform` system extension (see sysext/), merged over /usr at boot.
#
# Build with ./build.sh (it creates the signing keys and passes them in); see README.md.

[Distribution]
Distribution=debian
Release=trixie
Repositories=main,non-free-firmware

[Output]
Format=disk
ImageId=torngat
OutputDirectory=out
# No separate kernel and initrd.
SplitArtifacts=

[Build]
# Our ukify wrapper.
ExtraSearchPaths=tools
# Scripts do not get this directory, which has the keys.
BuildSources=

[Validation]
SecureBoot=yes
# It would make systemd-boot replace the machine's keys; torngat-enroll-secure-boot adds to them.
SecureBootAutoEnroll=no
# For the initrd phase only: see tools/ukify.
SignExpectedPcr=yes

[Content]
Bootable=yes
Bootloader=systemd-boot
# mkosi's own list, and what finds the disk, shows the recovery key prompt and reads USB keyboards. The
# rest loads from /usr.
KernelModulesInitrdExclude=.*
KernelModulesInitrdInclude=
    default
    ^drivers/ata/
    ^drivers/block/
    ^drivers/gpu/drm/(ast|mgag200)/
    ^drivers/hid/hid-generic.ko
    ^drivers/hid/hid.ko
    ^drivers/hid/usbhid/
    ^drivers/md/
    ^drivers/message/fusion/
    ^drivers/nvme/host/
    ^drivers/pci/controller/vmd.ko
    ^drivers/scsi/
    ^drivers/usb/host/
    ^drivers/usb/storage/
    ^drivers/virtio/
# One signed file holds the kernel, the initrd and the command line (with the /usr root hash).
UnifiedKernelImages=yes
WithRecommends=no
CleanPackageMetadata=yes
RemoveFiles=
    # Licenses stay: firmware may only be passed on with them.
    /usr/share/doc/*/[!c]*
    /usr/share/doc/*/c[!o]*
    /usr/share/man
    /usr/share/info
    /usr/share/locale
    # Host keys are per machine: never bake them into the image (torngat-ssh-keygen.service
    # makes them on first boot).
    /etc/ssh/ssh_host_*
    # Nor the host ID (torngat-hostid.service): every machine would own every other's ZFS pools.
    /etc/hostid
    # No LVM, ZFS or btrfs storage is opened because a disk with it is attached, or a volume holding it is
    # opened.
    /usr/lib/udev/rules.d/69-lvm.rules
    /usr/lib/udev/rules.d/64-btrfs.rules
    /usr/lib/udev/rules.d/90-zfs.rules
    /usr/lib/modules-load.d/zfs.conf
    /usr/lib/systemd/system-generators/zfs-mount-generator
# QEMU comes from trixie-backports (pinned in mkosi.sandbox/etc/apt/preferences.d).
Packages=
    systemd
    systemd-boot
    # The plain loader, which mkosi signs with our key. Without it apt picks the package holding only
    # Debian's signed build, and mkosi silently installs that one.
    systemd-boot-efi
    systemd-sysv
    systemd-resolved
    systemd-repart
    # systemd-dissect, used by torngat-install-extension.
    systemd-container
    systemd-timesyncd
    udev
    dbus
    # Not the cloud kernel: it has no drivers for most server network cards and disk controllers.
    linux-image-amd64
    # For server network cards and HBAs, and processor fixes, which the UKI loads before the kernel.
    firmware-bnx2
    firmware-bnx2x
    firmware-intel-misc
    firmware-misc-nonfree
    firmware-qlogic
    firmware-realtek
    amd64-microcode
    intel-microcode
    qemu-system-x86
    # torngatd links esys and tctildr; tctildr loads the device TCTI at run time.
    libtss2-esys-3.0.2-0t64
    libtss2-tctildr0t64
    libtss2-tcti-device0t64
    tpm2-tools
    openssh-server
    iproute2
    # kill (torngatd's last resort against a stuck QEMU); setsid, setpriv are in util-linux.
    procps
    # chattr, for torngat-enroll-secure-boot.
    e2fsprogs
    cryptsetup-bin
    lvm2
    # systemd-cryptenroll, used by torngat-seal-root.
    systemd-cryptsetup
    ca-certificates
# Root is the encrypted volume and nothing else, no partition is picked up by type, and no unsigned
# credentials are taken from the ESP or the firmware. The initrd ignores the root's fstab: it would
# mount what a substituted root asks for. Every USB keyboard uses the generic driver: the initrd has no other.
# The IOMMU also covers Intel's integrated GPU, which Debian leaves out.
KernelCommandLine=root=/dev/mapper/root rootfstype=ext4 rw mount.usr=/dev/mapper/usr mount.usrfstype=erofs mount.usrflags=ro systemd.gpt_auto=no rd.fstab=no noresume hid.ignore_special_drivers=1 intel_iommu=on systemd.import_credentials=no console=ttyS0 console=tty0 systemd.journald.forward_to_console=0 systemd.firstboot=no
Hostname=torngat
Timezone=UTC
Locale=C.UTF-8
Keymap=us
# No root password: log in with an SSH key (build.sh --authorized-keys) or a dev build's console
# autologin (build.sh --dev).
