# Torngat host image: Debian 13, read-only /usr (erofs + dm-verity, signed root hash), writable
# ext4 root for /etc and /var. The platform itself is not in this image: it ships as the signed
# `torngat-platform` system extension (see sysext/), merged over /usr at boot.
#
# Build with ./build.sh (it creates the signing keys and passes them in); see README.md.

[Distribution]
Distribution=debian
Release=trixie
Repositories=main

[Output]
Format=disk
ImageId=torngat
OutputDirectory=out
# No separate kernel and initrd.
SplitArtifacts=

[Build]
# Our ukify wrapper.
ExtraSearchPaths=tools

[Validation]
SecureBoot=yes
# It would make systemd-boot replace the machine's keys; torngat-enroll-secure-boot adds to them.
SecureBootAutoEnroll=no
SignExpectedPcr=no

[Content]
Bootable=yes
Bootloader=systemd-boot
# One signed file holds the kernel, the initrd and the command line (with the /usr root hash).
UnifiedKernelImages=yes
WithRecommends=no
CleanPackageMetadata=yes
RemoveFiles=
    /usr/share/doc
    /usr/share/man
    /usr/share/info
    /usr/share/locale
    # Host keys are per machine: never bake them into the image (torngat-ssh-keygen.service
    # makes them on first boot).
    /etc/ssh/ssh_host_*
# QEMU comes from trixie-backports (pinned in mkosi.sandbox/etc/apt/preferences.d).
Packages=
    systemd
    systemd-boot
    # The plain loader, which mkosi signs with our key. Without it apt picks the package holding only
    # Debian's signed build, and mkosi silently installs that one.
    systemd-boot-efi
    systemd-sysv
    systemd-resolved
    systemd-repart
    # systemd-dissect, used by torngat-install-extension.
    systemd-container
    systemd-timesyncd
    udev
    dbus
    linux-image-cloud-amd64
    qemu-system-x86
    # torngatd links esys and tctildr; tctildr loads the device TCTI at run time.
    libtss2-esys-3.0.2-0t64
    libtss2-tctildr0t64
    libtss2-tcti-device0t64
    tpm2-tools
    openssh-server
    iproute2
    # kill (torngatd's last resort against a stuck QEMU); setsid, setpriv are in util-linux.
    procps
    # chattr, for torngat-enroll-secure-boot.
    e2fsprogs
    cryptsetup-bin
    ca-certificates
KernelCommandLine=console=ttyS0 console=tty0 systemd.journald.forward_to_console=0 systemd.firstboot=no
Hostname=torngat
Timezone=UTC
Locale=C.UTF-8
Keymap=us
# No root password: log in with an SSH key (build.sh --authorized-keys) or a dev build's console
# autologin (build.sh --dev).
